name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Isse aap manually bhi build trigger kar sakte hain

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Buildozer cache setup karne se build speed badh jati hai
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Buildozer
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ steps.get-date.outputs.date }}

      # Buildozer Action ka istemal karke APK build karna
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      # Generated APK ko artifacts mein upload karna taaki aap download kar sakein
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: python-downloader-apk
          path: bin/*.apk
