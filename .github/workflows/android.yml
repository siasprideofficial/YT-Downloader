name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ubuntu Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev libffi-dev maven clang lldb lld

      # Is step ko update kiya gaya hai (GitHub se direct latest code download hoga)
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer.git
          pip install cython==0.29.33

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: python-downloader-apk
          path: bin/*.apk
